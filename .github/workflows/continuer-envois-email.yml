name: Continuer les envois d'e-mails en attente

# Fait avancer toute campagne e-mail restée "en_cours" (cf. /admin/emails),
# même si personne n'a l'onglet ouvert dans un navigateur.
#
# Avant ce workflow, l'envoi par vagues ne pouvait avancer que pendant qu'un
# navigateur avait la page /admin/emails ouverte (c'est ce navigateur qui
# appelait /api/admin/emails/continuer en boucle). Fermer l'ordinateur, ou
# juste changer d'onglet trop longtemps, arrêtait tout net — vécu le
# 29/09/2026 avec la campagne de l'Assemblée Générale, restée bloquée
# plusieurs jours faute d'onglet ouvert en continu.
#
# Tourne toutes les 5 minutes et s'arrête tout de suite s'il n'y a rien à
# envoyer (cas normal l'immense majorité du temps) : le coût réel ne dépend
# que du temps où une campagne est vraiment en train d'être envoyée.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # pour tester manuellement depuis l'onglet Actions de GitHub

jobs:
  continuer:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc -o pipefail -e {0}
    steps:
      - name: Avancer les campagnes en attente, par petites vagues
        run: |
          # Le verrou serveur limite chaque campagne à une vague de 2 e-mails
          # toutes les ~20 s (cf. app/api/admin/emails/continuer/route.js) :
          # on boucle donc pendant ~4 minutes en interrogeant toutes les 15 s,
          # pour rester sous les 5 minutes qui séparent deux déclenchements du
          # cron, puis on laisse la main au prochain passage.
          for i in $(seq 1 16); do
            reponse=$(curl -s -X POST "https://sou-montmerle.fr/api/admin/emails/continuer" \
              -H "Content-Type: application/json" \
              -H "x-admin-token: ${{ secrets.ADMIN_IMPORT_TOKEN }}" \
              -d '{}')
            echo "$reponse"

            actives=$(echo "$reponse" | jq '[.campagnes[]? | select(.done != true and .verrouille != true)] | length')

            if [ "$actives" = "0" ] || [ -z "$actives" ]; then
              echo "Rien (ou plus rien) à envoyer — arrêt anticipé."
              exit 0
            fi

            sleep 15
          done
